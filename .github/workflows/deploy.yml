name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - run: |
          rm -rf out
          mkdir -p out
          cp .next/server/app/index.html out/index.html
          if [ -f .next/server/app/_not-found.html ]; then cp .next/server/app/_not-found.html out/404.html; fi
          mkdir -p out/_next/static
          cp -R .next/static/* out/_next/static/
          cp -R public/* out/
        shell: bash

      - uses: actions/configure-pages@v3

      - uses: actions/upload-pages-artifact@v1
        with:
          path: out

      - uses: actions/deploy-pages@v1
