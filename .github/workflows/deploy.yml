name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - run: |
          rm -rf out
          mkdir -p out
          cp .next/server/app/index.html out/index.html
          if [ -f .next/server/app/_not-found.html ]; then cp .next/server/app/_not-found.html out/404.html; fi
          mkdir -p out/_next/static
          cp -R .next/static/* out/_next/static/
          cp -R public/* out/
        shell: bash

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
